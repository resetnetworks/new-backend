services:
  backend:
    image: resetnetworks/new-music-backend:${TAG}   # use the image from Docker Hub
    container_name: new-music-backend
    restart: always
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      - redis

  email-worker:
    image: resetnetworks/new-music-backend:${TAG}
    restart: always
    env_file:
      - .env
    depends_on:
      - redis
    command: npm run email-worker

  redis:
    image: redis:7
    container_name: redis
    restart: always
    volumes:
      - redis-data:/data

volumes:
  redis-data: