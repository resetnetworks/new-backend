<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResetMusic Ingestion Dashboard</title>
  <!-- Outfit Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0c1b 0%, #1e1333 50%, #0d0b1a 100%);
      --card-bg: rgba(25, 18, 44, 0.45);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-color: #a855f7;
      --accent-glow: rgba(168, 85, 247, 0.4);
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --glass-filter: blur(16px);
      --transition-speed: 0.3s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: var(--text-main);
      overflow-x: hidden;
      padding: 2rem 1rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Header styling */
    header {
      text-align: center;
      margin-bottom: 3rem;
      position: relative;
    }

    header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -1px;
      background: linear-gradient(90deg, #c084fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-sub);
      font-size: 1.1rem;
      font-weight: 300;
    }

    /* Layout structure */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media (min-width: 900px) {
      .dashboard-grid {
        grid-template-columns: 380px 1fr;
      }
    }

    /* Card Panels */
    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: var(--glass-filter);
      -webkit-backdrop-filter: var(--glass-filter);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: transform var(--transition-speed), border-color var(--transition-speed);
    }

    .panel:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .panel-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 0.75rem;
    }

    /* Form control */
    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.8rem 1rem;
      color: var(--text-main);
      font-size: 1rem;
      transition: border-color var(--transition-speed), box-shadow var(--transition-speed);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn {
      width: 100%;
      background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity var(--transition-speed), box-shadow var(--transition-speed);
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.2);
    }

    .btn:hover {
      opacity: 0.9;
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.4);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Album Draft Cards List */
    .drafts-list {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 600px) {
      .drafts-list {
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      }
    }

    .album-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all var(--transition-speed);
      position: relative;
    }

    .album-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-color);
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.15);
    }

    .album-cover-container {
      width: 100%;
      aspect-ratio: 1;
      background: #181424;
      position: relative;
    }

    .album-cover-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .album-info {
      padding: 1.25rem;
    }

    .album-title-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .album-genres {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }

    .genre-badge {
      background: rgba(168, 85, 247, 0.15);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.3);
      font-size: 0.75rem;
      padding: 0.1rem 0.5rem;
      border-radius: 99px;
      text-transform: capitalize;
    }

    /* Modal review panel styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(10, 8, 18, 0.85);
      backdrop-filter: blur(12px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 1rem;
      animation: fadeIn 0.25s ease-out;
    }

    .modal {
      background: #161226;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      max-width: 850px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-header {
      padding: 1.5rem 2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 1.8rem;
      cursor: pointer;
      transition: color var(--transition-speed);
    }

    .modal-close-btn:hover {
      color: var(--text-main);
    }

    .modal-content {
      padding: 2rem;
      overflow-y: auto;
    }

    .album-review-header {
      display: flex;
      gap: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .review-cover-img {
      width: 150px;
      height: 150px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .review-meta {
      flex: 1;
      min-width: 250px;
    }

    .review-meta h2 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }

    .review-meta p {
      color: var(--text-sub);
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
    }

    /* Tracklist table styling */
    .tracks-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 1.5rem;
    }

    .tracks-table th {
      text-align: left;
      color: var(--text-sub);
      font-size: 0.9rem;
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-weight: 500;
    }

    .tracks-table td {
      padding: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      font-size: 0.95rem;
    }

    .track-num {
      color: var(--text-sub);
      width: 40px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 500;
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
    }

    .status-missing {
      background: rgba(239, 68, 68, 0.12);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .status-ready {
      background: rgba(16, 185, 129, 0.12);
      color: #a7f3d0;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .track-action-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-main);
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
      transition: all var(--transition-speed);
    }

    .track-action-btn:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    .modal-footer {
      padding: 1.5rem 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      display: flex;
      justify-content: flex-end;
      gap: 1rem;
    }

    /* Alerts and Status Messages */
    .alert {
      padding: 1rem 1.25rem;
      border-radius: 12px;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      display: none;
      animation: slideIn var(--transition-speed);
    }

    .alert-success {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .alert-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes slideUp {
      from { transform: translateY(30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes slideIn {
      from { transform: translateX(30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ResetMusic</h1>
      <p>Bandcamp Migration Ingestion Dashboard</p>
    </header>

    <div class="dashboard-grid">
      <!-- Left sidebar: Ingest new URLs -->
      <div class="panel">
        <h2 class="panel-title">🚀 Launch Migration</h2>
        <div id="migration-alert" class="alert"></div>
        <form id="migration-form">
          <div class="form-group">
            <label for="bandcamp-url">Bandcamp Artist URL</label>
            <input type="url" id="bandcamp-url" class="form-control" placeholder="https://artist.bandcamp.com" required>
          </div>
          <div class="form-group">
            <label for="workspace-id">Workspace ID (Optional)</label>
            <input type="text" id="workspace-id" class="form-control" placeholder="e.g. 65cb75f643f8e563065b2100">
          </div>
          <button type="submit" id="submit-btn" class="btn">Start Migration Job</button>
        </form>
      </div>

      <!-- Right Main Panel: Staged Drafts list -->
      <div class="panel">
        <h2 class="panel-title">🎵 Staged Draft Albums</h2>
        <div id="general-alert" class="alert"></div>
        <div id="drafts-container" class="drafts-list">
          <!-- Populated dynamically -->
        </div>
      </div>
    </div>
  </div>

  <!-- Detailed Album Review Modal -->
  <div id="review-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-album-title" style="font-weight:600;">Album Details</h3>
        <button class="modal-close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-content">
        <div id="modal-alert" class="alert"></div>
        <div class="album-review-header">
          <img id="modal-cover-img" class="review-cover-img" src="" alt="Album Cover">
          <div class="review-meta">
            <h2 id="modal-title-header">Album Title</h2>
            <p id="modal-artist">Artist: -</p>
            <p id="modal-release-date">Release Date: -</p>
            <p id="modal-genres">Genres: -</p>
            <p id="modal-desc" style="margin-top: 1rem; color: var(--text-sub); line-height: 1.5;"></p>
          </div>
        </div>

        <h4 style="font-weight:600; margin-top:2rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem;">Tracklist & Audio Files</h4>
        <table class="tracks-table">
          <thead>
            <tr>
              <th class="track-num">#</th>
              <th>Track Title</th>
              <th>Duration</th>
              <th>Audio Status</th>
              <th style="text-align:right;">Actions</th>
            </tr>
          </thead>
          <tbody id="modal-tracks-body">
            <!-- Populated dynamically -->
          </tbody>
        </table>
      </div>
      <div class="modal-footer">
        <button class="track-action-btn" onclick="closeModal()">Cancel</button>
        <button id="modal-publish-btn" class="btn" style="width:auto; padding: 0.8rem 2rem;">Publish Album</button>
      </div>
    </div>
  </div>

  <script>
    let activeAlbumId = null;

    // Load drafts on page boot
    document.addEventListener("DOMContentLoaded", loadDraftAlbums);

    // Form submission to trigger migration
    document.getElementById("migration-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const urlInput = document.getElementById("bandcamp-url");
      const workspaceInput = document.getElementById("workspace-id");
      const submitBtn = document.getElementById("submit-btn");
      const alertBox = document.getElementById("migration-alert");

      const body = { url: urlInput.value.trim() };
      if (workspaceInput.value.trim()) {
        body.workspaceId = workspaceInput.value.trim();
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Launching Job...";
      showAlert(alertBox, "");

      try {
        const res = await fetch("/migration/bandcamp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const result = await res.json();
        
        if (result.success) {
          showAlert(alertBox, "success", `Migration Job created successfully! ID: ${result.data._id}`);
          urlInput.value = "";
          setTimeout(loadDraftAlbums, 2000);
        } else {
          showAlert(alertBox, "danger", result.message || "Failed to create job.");
        }
      } catch (err) {
        showAlert(alertBox, "danger", "Network error starting migration.");
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Start Migration Job";
      }
    });

    // Fetch Draft Albums
    async function loadDraftAlbums() {
      const container = document.getElementById("drafts-container");
      const alertBox = document.getElementById("general-alert");
      container.innerHTML = "<p style='color: var(--text-sub);'>Loading draft albums...</p>";

      try {
        const res = await fetch("/migration/drafts/albums");
        const result = await res.json();

        if (result.success) {
          container.innerHTML = "";
          if (result.data.length === 0) {
            container.innerHTML = "<p style='color: var(--text-sub); grid-column: 1/-1;'>No staging draft albums found. Launch a migration to populate drafts!</p>";
            return;
          }
          result.data.forEach(album => {
            const card = document.createElement("div");
            card.className = "album-card";
            card.onclick = () => openAlbumReview(album._id);
            
            const coverImage = album.coverImage ? "https://reset-streaming.s3.ap-south-1.amazonaws.com/" + album.coverImage : "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=400";
            const genresHtml = (album.genres || [])
              .slice(0, 3)
              .map(g => `<span class="genre-badge">${g}</span>`)
              .join("");
              console.log("Genres HTML:", coverImage); // Debugging line to check genresHtml content

            card.innerHTML = `
              <div class="album-cover-container">
                <img class="album-cover-img" src="${coverImage}" alt="${album.title}">
              </div>
              <div class="album-info">
                <div class="album-title-text" title="${album.title}">${album.title}</div>
                <div class="album-genres">${genresHtml}</div>
              </div>
            `;
            container.appendChild(card);
          });
        } else {
          showAlert(alertBox, "danger", "Failed to retrieve draft albums.");
        }
      } catch (err) {
        showAlert(alertBox, "danger", "Error communicating with the database.");
      }
    }

    // Open detailed review modal
    async function openAlbumReview(albumId) {
      activeAlbumId = albumId;
      const modal = document.getElementById("review-modal");
      const titleHeader = document.getElementById("modal-title-header");
      const coverImg = document.getElementById("modal-cover-img");
      const artistP = document.getElementById("modal-artist");
      const releaseDateP = document.getElementById("modal-release-date");
      const genresP = document.getElementById("modal-genres");
      const descP = document.getElementById("modal-desc");
      const tracksBody = document.getElementById("modal-tracks-body");
      const modalAlert = document.getElementById("modal-alert");
      const publishBtn = document.getElementById("modal-publish-btn");

      showAlert(modalAlert, "");
      tracksBody.innerHTML = "<tr><td colspan='5' style='text-align:center;'>Loading tracks...</td></tr>";
      modal.style.display = "flex";

      try {
        const res = await fetch(`/migration/drafts/albums/${albumId}`);
        const result = await res.json();

        if (result.success) {
          const { album, tracks } = result.data;
          titleHeader.textContent = album.title;
          coverImg.src = album.coverImage ? "https://reset-streaming.s3.ap-south-1.amazonaws.com/" + album.coverImage : "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?q=80&w=400";
          artistP.innerHTML = `<strong>Artist ID Reference:</strong> ${album.artistId}`;
          releaseDateP.innerHTML = `<strong>Release Date:</strong> ${album.releaseDate ? new Date(album.releaseDate).toLocaleDateString() : 'N/A'}`;
          genresP.innerHTML = `<strong>Genres:</strong> ${(album.genres || []).join(", ") || 'None'}`;
          descP.textContent = album.description || "No description provided.";

          tracksBody.innerHTML = "";
          tracks.forEach(track => {
            const tr = document.createElement("tr");
            const isReady = !!track.audioKey;
            
            const minutes = Math.floor(track.duration / 60);
            const seconds = Math.floor(track.duration % 60).toString().padStart(2, "0");
            const durationFormatted = track.duration ? `${minutes}:${seconds}` : "--:--";

            const statusClass = isReady ? "status-ready" : "status-missing";
            const statusLabel = isReady ? "● Ready" : "○ Missing Audio";

            const actionBtn = isReady 
              ? `<button class="track-action-btn" onclick="mockAudioUpload('${track._id}', event)">Replace Mock Audio</button>`
              : `<button class="track-action-btn" onclick="mockAudioUpload('${track._id}', event)">Mock Audio Upload</button>`;

            tr.innerHTML = `
              <td class="track-num">${track.trackNumber}</td>
              <td>${track.title}</td>
              <td>${durationFormatted}</td>
              <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
              <td style="text-align:right;">${actionBtn}</td>
            `;
            tracksBody.appendChild(tr);
          });

          // Setup publish button event listener
          publishBtn.onclick = () => publishAlbum(albumId);
        } else {
          showAlert(modalAlert, "danger", "Failed to retrieve album details.");
        }
      } catch (err) {
        showAlert(modalAlert, "danger", "Network error fetching tracks.");
      }
    }

    // Mock Audio upload
    async function mockAudioUpload(trackId, event) {
      event.stopPropagation();
      const modalAlert = document.getElementById("modal-alert");
      showAlert(modalAlert, "");

      // Generate a mock S3 key to simulate successful client file upload
      const mockKey = `songs/audio/${trackId}-mock-upload.mp3`;

      try {
        const res = await fetch(`/migration/drafts/tracks/${trackId}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ audioKey: mockKey })
        });
        const result = await res.json();

        if (result.success) {
          showAlert(modalAlert, "success", `Mock Audio uploaded for track: "${result.data.title}"`);
          // Reload the details view
          openAlbumReview(activeAlbumId);
        } else {
          showAlert(modalAlert, "danger", result.message || "Failed to upload audio.");
        }
      } catch (err) {
        showAlert(modalAlert, "danger", "Network error updating track audio.");
      }
    }

    // Publish Album
    async function publishAlbum(albumId) {
      const modalAlert = document.getElementById("modal-alert");
      const publishBtn = document.getElementById("modal-publish-btn");

      publishBtn.disabled = true;
      publishBtn.textContent = "Publishing...";
      showAlert(modalAlert, "");

      try {
        const res = await fetch(`/migration/drafts/albums/${albumId}/publish`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: "65cb75f643f8e563065b2105" }) // Mock User ID
        });
        const result = await res.json();

        if (result.success) {
          showAlert(modalAlert, "success", "🎉 Album published to production successfully!");
          setTimeout(() => {
            closeModal();
            loadDraftAlbums();
          }, 3000);
        } else {
          showAlert(modalAlert, "danger", result.message || "Failed to publish album.");
        }
      } catch (err) {
        showAlert(modalAlert, "danger", "Network error during publishing.");
      } finally {
        publishBtn.disabled = false;
        publishBtn.textContent = "Publish Album";
      }
    }

    // Close modal
    function closeModal() {
      document.getElementById("review-modal").style.display = "none";
      activeAlbumId = null;
    }

    // Helper to show custom alerts
    function showAlert(alertEl, type, message = "") {
      if (!type) {
        alertEl.style.display = "none";
        alertEl.textContent = "";
        return;
      }
      alertEl.className = `alert alert-${type}`;
      alertEl.textContent = message;
      alertEl.style.display = "block";
    }
  </script>
</body>
</html>
