<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Music - Admin Copyright & Verification Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0f17;
      --card-bg: rgba(23, 27, 44, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 50px;
    }

    /* Top Navigation Header */
    header {
      background: rgba(13, 15, 23, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--primary), #ec4899);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 18px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(90deg, #ffffff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Token Auth Box */
    .auth-container {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 10px;
    }

    .auth-container input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 14px;
      width: 280px;
      outline: none;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      border: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-scan {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }
    .btn-scan:hover {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      transform: translateY(-1px);
    }

    .btn-success {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid rgba(16, 185, 129, 0.4);
    }
    .btn-success:hover { background: var(--success); color: #fff; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: #e5e7eb;
    }
    .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }

    /* Main Layout */
    .container {
      max-width: 1280px;
      margin: 32px auto;
      padding: 0 24px;
    }

    /* Stats Overview Cards */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 20px;
      border-radius: 14px;
      backdrop-filter: blur(8px);
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
    }

    /* Filter Tabs & Search */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
    }

    .tab {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      background: transparent;
      border: none;
      transition: all 0.2s;
    }

    .tab.active {
      background: var(--primary);
      color: #fff;
    }

    .search-input {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      min-width: 260px;
    }

    /* Songs List Cards */
    .songs-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .song-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .song-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }

    .song-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .song-info {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .cover-img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: cover;
      background: #1e293b;
    }

    .song-details h3 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .song-details p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Badges */
    .badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-clean {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .badge-match {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    .badge-pending {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .badge-error {
      background: rgba(156, 163, 175, 0.15);
      color: #9ca3af;
      border: 1px solid rgba(156, 163, 175, 0.3);
    }

    /* AudD Copyright Match Details Box */
    .audd-box {
      background: rgba(0, 0, 0, 0.3);
      border: 1px dashed var(--card-border);
      border-radius: 12px;
      padding: 16px;
      font-size: 13px;
    }

    .audd-box.match {
      border-color: rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.05);
    }

    .audd-box.clean {
      border-color: rgba(16, 185, 129, 0.4);
      background: rgba(16, 185, 129, 0.05);
    }

    .audd-title {
      font-weight: 700;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Audio Player */
    audio {
      width: 100%;
      height: 40px;
      border-radius: 8px;
      outline: none;
    }

    /* Card Footer Actions */
    .song-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--card-border);
      padding-top: 16px;
      flex-wrap: wrap;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px dashed var(--card-border);
    }

    /* Notification Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 500;
      font-size: 14px;
      background: #1f2937;
      color: #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">
      <div class="brand-logo">🎵</div>
      <div class="brand-title">Reset Music Copyright Moderation</div>
    </div>

    <div class="auth-container">
      <span style="font-size: 13px; color: var(--text-muted);">🔑 Auth Token:</span>
      <input type="text" id="authTokenInput" placeholder="Paste JWT Bearer token here...">
      <button class="btn btn-primary" onclick="saveToken()">Save Token</button>
    </div>
  </header>

  <div class="container">
    
    <!-- Stats Overview -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">UNVERIFIED SONGS</div>
        <div class="stat-value" id="statUnverified">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">AUDD MATCHES FOUND</div>
        <div class="stat-value" style="color: #f87171;" id="statMatches">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">AUDD CLEAN SCANS</div>
        <div class="stat-value" style="color: #34d399;" id="statClean">0</div>
      </div>
    </div>

    <!-- Toolbar Filters -->
    <div class="toolbar">
      <div class="tabs">
        <button class="tab active" onclick="setFilter('')">All Unverified</button>
        <button class="tab" onclick="setFilter('match_found')">⚠️ Match Found</button>
        <button class="tab" onclick="setFilter('clean')">✅ AudD Clean</button>
        <button class="tab" onclick="setFilter('pending')">⏳ Pending Scan</button>
      </div>

      <input type="text" class="search-input" id="searchInput" placeholder="Search track title..." oninput="debounceSearch()">
    </div>

    <!-- Songs List Container -->
    <div class="songs-container" id="songsList">
      <div class="empty-state">Loading unverified songs...</div>
    </div>

  </div>

  <div id="toast">Notification</div>

  <script>
    let currentFilter = '';
    let searchQuery = '';
    let searchTimeout = null;

    // Load saved token on startup
    document.addEventListener('DOMContentLoaded', () => {
      const savedToken = localStorage.getItem('reset_admin_token') || '';
      document.getElementById('authTokenInput').value = savedToken;
      fetchUnverifiedSongs();
    });

    function saveToken() {
      const token = document.getElementById('authTokenInput').value.trim();
      localStorage.setItem('reset_admin_token', token);
      showToast('Auth token saved successfully!');
      fetchUnverifiedSongs();
    }

    function getAuthHeaders() {
      const token = localStorage.getItem('reset_admin_token') || '';
      return {
        'Content-Type': 'application/json',
        'Authorization': token.startsWith('Bearer ') ? token : `Bearer ${token}`
      };
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      event.target.classList.add('active');
      fetchUnverifiedSongs();
    }

    function debounceSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchQuery = document.getElementById('searchInput').value.trim();
        fetchUnverifiedSongs();
      }, 400);
    }

    async function fetchUnverifiedSongs() {
      const songsList = document.getElementById('songsList');
      songsList.innerHTML = '<div class="empty-state">Loading songs...</div>';

      try {
        let url = `/api/v1/admin/copyright/unverified?page=1&limit=50`;
        if (currentFilter) url += `&statusFilter=${currentFilter}`;
        if (searchQuery) url += `&search=${encodeURIComponent(searchQuery)}`;

        const response = await fetch(url, { headers: getAuthHeaders() });
        const resData = await response.json();

        if (!response.ok) {
          throw new Error(resData.message || 'Failed to fetch songs. Check Auth Token.');
        }

        const songs = resData.data || [];
        updateStats(songs);

        if (songs.length === 0) {
          songsList.innerHTML = '<div class="empty-state">🎉 No unverified songs found in this view!</div>';
          return;
        }

        songsList.innerHTML = songs.map(song => renderSongCard(song)).join('');
      } catch (err) {
        songsList.innerHTML = `<div class="empty-state" style="color: #f87171;">⚠️ ${err.message}</div>`;
      }
    }

    function updateStats(songs) {
      document.getElementById('statUnverified').innerText = songs.length;
      document.getElementById('statMatches').innerText = songs.filter(s => s.copyrightCheck?.status === 'match_found').length;
      document.getElementById('statClean').innerText = songs.filter(s => s.copyrightCheck?.status === 'clean').length;
    }

    function renderSongCard(song) {
      const check = song.copyrightCheck || {};
      const status = check.status || 'pending';
      const isMatch = status === 'match_found';
      const isClean = status === 'clean';
      const isPending = status === 'pending';
      const isError = status === 'error';
      
      let badgeHtml = `<span class="badge badge-pending">⏳ Scan Pending</span>`;
      if (isMatch) badgeHtml = `<span class="badge badge-match">⚠️ Commercial Match Found</span>`;
      if (isClean) badgeHtml = `<span class="badge badge-clean">✅ AudD Clean</span>`;
      if (isError) badgeHtml = `<span class="badge badge-error">ℹ️ Setup / Error</span>`;

      const coverUrl = song.coverImageUrl || 'https://via.placeholder.com/64?text=Audio';
      const audioUrl = song.audioUrl || '';

      return `
        <div class="song-card" id="song-${song._id}">
          <div class="song-header">
            <div class="song-info">
              <img src="${coverUrl}" class="cover-img" alt="Cover">
              <div class="song-details">
                <h3>${escapeHtml(song.title)}</h3>
                <p>Artist: <strong>${escapeHtml(song.artist?.name || 'Unknown Artist')}</strong> (${escapeHtml(song.artist?.email || '')})</p>
                <p style="font-size: 12px; color: #6b7280; margin-top: 4px;">Uploaded: ${new Date(song.createdAt).toLocaleString()}</p>
              </div>
            </div>
            ${badgeHtml}
          </div>

          <!-- AudD Details Box -->
          <div class="audd-box ${isMatch ? 'match' : isClean ? 'clean' : ''}">
            <div class="audd-title">
              🔍 AudD Copyright Scan Status: 
              <span style="color: ${isMatch ? '#f87171' : isClean ? '#34d399' : '#fbbf24'};">
                ${status.toUpperCase()}
              </span>
            </div>
            ${isMatch ? `
              <p>⚠️ <strong>Matched Title:</strong> ${escapeHtml(check.matchedTitle || 'N/A')}</p>
              <p>👤 <strong>Matched Artist:</strong> ${escapeHtml(check.matchedArtist || 'N/A')}</p>
              <p>🔤 <strong>ISRC:</strong> ${escapeHtml(check.matchedIsrc || 'N/A')}</p>
            ` : isClean ? `
              <p>✅ Scanned against AudD index: No matching commercial recording found on Spotify/Apple Music.</p>
            ` : isPending ? `
              <p>Click <strong>"🔍 Scan with AudD"</strong> below to trigger copyright fingerprint matching.</p>
            ` : `
              <p style="color: #9ca3af;">${escapeHtml(check.rawResponse?.error || 'Scan not completed.')}</p>
            `}

            <!-- Full AudD Raw Response Output -->
            ${check.rawResponse ? `
              <details style="margin-top: 12px; background: rgba(0,0,0,0.4); border-radius: 8px; padding: 8px 12px; border: 1px solid rgba(255,255,255,0.08);" open>
                <summary style="cursor: pointer; font-weight: 600; color: #a5b4fc; font-size: 12px; user-select: none;">
                  📋 Full AudD API Response (JSON)
                </summary>
                <pre style="margin-top: 8px; font-family: monospace; font-size: 12px; color: #38bdf8; background: #07090e; padding: 12px; border-radius: 6px; overflow-x: auto; max-height: 250px; white-space: pre-wrap; word-break: break-all;">${escapeHtml(JSON.stringify(check.rawResponse, null, 2))}</pre>
              </details>
            ` : ''}
          </div>

          <!-- Audio Preview Player -->
          ${audioUrl ? `
            <audio controls src="${audioUrl}"></audio>
          ` : '<p style="font-size: 12px; color: #9ca3af;">Audio URL not available</p>'}

          <!-- Actions -->
          <div class="song-actions">
            <button class="btn btn-scan" id="scan-btn-${song._id}" onclick="scanSong('${song._id}')">
              ${isPending ? '🔍 Scan with AudD' : '🔄 Re-scan AudD'}
            </button>
            <button class="btn btn-danger" onclick="takedownSong('${song._id}')">⛔ Takedown & Unpublish</button>
            <button class="btn btn-success" onclick="verifySong('${song._id}')">✅ Mark Verified</button>
          </div>
        </div>
      `;
    }

    async function scanSong(songId) {
      const btn = document.getElementById(`scan-btn-${songId}`);
      if (btn) {
        btn.disabled = true;
        btn.innerText = '⏳ Calling AudD API...';
      }
      showToast('🔍 Initiating AudD acoustic scan...');

      try {
        const response = await fetch(`/api/v1/admin/copyright/scan/${songId}`, {
          method: 'POST',
          headers: getAuthHeaders()
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Scan request failed');

        if (data.data?.status === 'match_found') {
          showToast(`⚠️ Match Found: "${data.data.matchedTitle}" by ${data.data.matchedArtist}`);
        } else if (data.data?.status === 'clean') {
          showToast('✅ AudD Scan completed: Track is clean!');
        } else if (data.data?.status === 'error') {
          showToast(`ℹ️ ${data.data.rawResponse?.error || 'Scan error'}`);
        } else {
          showToast('✅ AudD Scan completed!');
        }

        fetchUnverifiedSongs();
      } catch (err) {
        showToast(`❌ Error: ${err.message}`);
        if (btn) {
          btn.disabled = false;
          btn.innerText = '🔍 Scan with AudD';
        }
      }
    }

    async function verifySong(songId) {
      if (!confirm('Are you sure you want to mark this song as Verified?')) return;
      try {
        const response = await fetch(`/api/v1/admin/copyright/verify/${songId}`, {
          method: 'POST',
          headers: getAuthHeaders()
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Verification failed');
        showToast('✅ Song verified successfully!');
        fetchUnverifiedSongs();
      } catch (err) {
        showToast(`❌ Error: ${err.message}`);
      }
    }

    async function takedownSong(songId) {
      const reason = prompt('Enter takedown / copyright violation reason:', 'Copyright infringement match found on AudD');
      if (reason === null) return;

      try {
        const response = await fetch(`/api/v1/admin/copyright/takedown/${songId}`, {
          method: 'POST',
          headers: getAuthHeaders(),
          body: JSON.stringify({ reason })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || 'Takedown failed');
        showToast('⛔ Song taken down and unpublished!');
        fetchUnverifiedSongs();
      } catch (err) {
        showToast(`❌ Error: ${err.message}`);
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }
  </script>
</body>
</html>
